
name: NEXLOAD Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Check AndroidManifest XML
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("app/src/main/AndroidManifest.xml")
          print("XML syntax OK")
          PY

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Signing key secret is missing"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexload-release.jks"

      - name: Build signed release APK
        env:
          NEXLOAD_KEYSTORE_FILE: ${{ runner.temp }}/nexload-release.jks
          NEXLOAD_KEYSTORE_PASSWORD: ${{ secrets.NEXLOAD_KEYSTORE_PASSWORD }}
          NEXLOAD_KEY_PASSWORD: ${{ secrets.NEXLOAD_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXLOAD-RELEASE-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
